openapi: 3.1.0
info:
  title: 'Stud.IP Timesheet plugin API Routes'
  license:
    name: GPL-3.0 WITH License-Supplement (see LICENSE-SUPPLEMENT.txt)
    identifier: GPL-3.0
    url: https://github.com/elan-ev/studip-timesheet/blob/main/LICENSE
  version: 0.0.1
servers:
