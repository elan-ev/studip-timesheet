        '200':
          description: 'Returning list of Contracts'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContractCollection'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags:
        - Contracts
      summary: Create a contract
      operationId: \StudipTimesheet\JsonApi\Routes\Contract\Create
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContractDataPostWrapper"
      responses:
        '201':
          description: 'Created contract'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Contract'
        '401':
          $ref: '#/components/responses/Unauthorized'
